# Version 15.3.2 Emergency Contact Source Ledger

**Verified:** August 4, 2026

Colorado backcountry search and rescue is activated through **911 and the responsible county sheriff/dispatch**. The volunteer-team name is provided for jurisdictional context; the app does not direct the user to bypass 911 or county dispatch.

Official statewide guidance: https://cpw.state.co.us/backcountry-search-and-rescue-program

Route and county boundaries can differ. These are verified defaults for the current expedition and Road to 50 targets. Alternate routes require confirmation.

